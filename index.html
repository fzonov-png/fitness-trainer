<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0e13">
  <meta name="description" content="Тренер 41 — домашняя программа тренировок: гребля, гири, гантели, турник, собственный вес, растяжка. Дневник и прогресс.">
  <title>Тренер 41 — программа тренировок</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Тренер 41">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand__mark" aria-hidden="true">41</div>
        <div>
          <div class="brand__name">ТРЕНЕР 41</div>
          <div class="brand__sub" id="brand-sub">12-недельный цикл</div>
        </div>
      </div>
      <button class="ready-pill ready-pill--none" id="ready-pill" data-tab="today">готовность</button>
    </header>

    <main id="view" aria-live="polite">
      <div class="card" style="margin-top:16px">
        <h1>Загрузка программы…</h1>
        <p style="color:#93a3b8;font-size:13px;margin-top:8px">Если текст не появился, обнови страницу.</p>
      </div>
    </main>
  </div>

  <nav id="tabs" aria-label="Разделы приложения">
    <button class="tab is-active" data-tab="today">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4"></circle>
        <path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"></path>
      </svg>
      <span>Сегодня</span>
    </button>
    <button class="tab" data-tab="week">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
        <rect x="3" y="5" width="18" height="16" rx="3"></rect>
        <path d="M3 10h18M8 3v4M16 3v4"></path>
        <path d="M8 14h.01M12 14h.01M16 14h.01M8 17h.01M12 17h.01"></path>
      </svg>
      <span>Неделя</span>
    </button>
    <button class="tab" data-tab="progress">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 20V10M10 20V4M16 20v-7M22 20H2"></path>
      </svg>
      <span>Прогресс</span>
    </button>
    <button class="tab" data-tab="guide">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21.5z"></path>
        <path d="M4 18.5V5.5M8 7h8M8 11h6"></path>
      </svg>
      <span>Гид</span>
    </button>
  </nav>

  <div id="sheet" hidden></div>

  <script src="program.js"></script>
  <script src="app.js"></script>
  <script src="views-today.js"></script>
  <script src="views-more.js"></script>
  <script src="views-guide.js"></script>
  <script src="app-events.js"></script>
</body>
</html>
